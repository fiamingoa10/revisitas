<!DOCTYPE html>
<html lang="es" class="device-desktop">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1E4AA9" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Revisitas" />
    <title>Instalar Revisitas en tu pantalla de inicio</title>

    <!-- Manifest y íconos -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" />

    <style>
      body {
        background-color: #1e4aa9;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 2rem;
      }
      h1, h2 {
        margin: 1rem 0;
      }
      img {
        max-width: 180px;
        margin: 1rem auto;
      }
      .steps {
        margin-top: 2rem;
        text-align: left;
        display: inline-block;
      }
      .steps p {
        margin: 0.5rem 0;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="/icon-192.png" alt="Icono Revisitas" width="64" height="64" />
      <h1>Revisitas</h1>
    </header>

    <main>
      <h2>Agregá Revisitas a tu pantalla de inicio</h2>
      <p>En tu navegador, tocá el ícono de compartir y seleccioná <strong>Agregar a pantalla de inicio</strong>.</p>
      <img src="/icon-512.png" alt="Revisitas App Icon" />

      <div class="steps">
        <p>1. Abrí el menú de opciones de tu navegador.</p>
        <p>2. Seleccioná <strong>Agregar a pantalla de inicio</strong>.</p>
        <p>3. ¡Listo! Revisitas estará disponible como aplicación.</p>
      </div>
    </main>
  </body>
</html>
